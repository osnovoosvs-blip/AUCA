name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: |
          for i in 1 2 3; do
            mvn -B clean package -DskipTests && exit 0
            echo "Сборка не удалась (попытка $i из 3), повторяю..."
          done
          echo "Сборка Maven не удалась после 3 попыток."
          exit 1

      - name: Verify jar
        run: |
          ls -l target/*.jar
          test -n "$(ls target/*.jar 2>/dev/null)"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/*.jar
